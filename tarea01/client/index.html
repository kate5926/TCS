<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agenda Web </title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background-color: #0056b3; }
    .error { color: red; margin-top: 10px; }
    ul { list-style: none; padding: 0; }
    li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Agenda de Contactos </h2>
    
    <form id="contactoForm">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="text" id="telefono" placeholder="Teléfono" required>
      <input type="email" id="email" placeholder="Correo electrónico">
      <button type="submit">Guardar Contacto</button>
    </form>
    
    <div id="mensajeError" class="error"></div>

    <h3>Contactos Guardados</h3>
    <ul id="listaContactos"></ul>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
